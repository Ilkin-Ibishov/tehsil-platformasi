# HANDOFF (73): "sıfır test" probleminin ən ucuz hissəsini bağlayır — 27 selftest halı
# (`scripts/eval.py --selftest`), 18/30/15 TS selftest halı (`web/lib/**/*.selftest.mts`)
# artıq var, sadəcə heç nə onları avtomatik işlətmirdi. Üç iş, paralel, hər push/PR-da.
#
# Qəsdən BURADA YOXDUR: TS selftest-lərin (`answer`/`math-format`/`step-check`) özləri —
# HANDOFF (73) yalnız `--selftest`/`tsc`/`eslint` istədi. `npx tsx **/*.selftest.mts` əlavə
# etmək asan növbəti addımdır, bu ADR-in/tapşırığın əhatəsində deyil.
#
# `npm ci` YOX, `npm install` — CI-ni ilk dəfə qurarkən tapıldı: committed
# `package-lock.json` Linux-a xas optional native-binary girişlərini (`@emnapi/*`,
# `@swc/helpers`) daşımır, çünki lokal inkişaf mühiti Windows-dur və o platformada npm
# onları lazımsız sayır. `npm ci` bunu "sinxron deyil" kimi rədd edir, `npm install`
# YOX. Lockfile-ı Windows-dan Linux-uyğun yenidən yaratmaq mümkün olmadığı üçün (bu
# mühitdə Linux npm yoxdur) `npm install` işlədilir — determinizm bir az azalır, amma
# faktiki işləyən yeganə seçimdir.

name: CI

on:
  push:
  pull_request:

jobs:
  eval-selftest:
    name: eval.py --selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      # `scripts/lib/verify.py::equation_cross_check` `web/lib/verify/cli.mts`-ə Node
      # alt-prosesi kimi müraciət edir (mathjs) — `node_modules` olmadan `--selftest`
      # `ERR_MODULE_NOT_FOUND: mathjs` ilə sınır. Bu addım əvvəllər YOX idi.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm install
        working-directory: web
      - run: python scripts/eval.py --selftest

  typecheck:
    name: tsc --noEmit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm install
      # `app/layout.tsx` App Router-in `LayoutProps<"/">` tipli-route tipindən istifadə
      # edir — bu, `.next/types/**` altında YARADILAN ambient tipdir (`next dev`/`build`-in
      # yan-effekti). Lokal inkişafda həmişə mövcuddur (`next dev` işlədilib), TƏMİZ CI
      # checkout-da YOXDUR — onsuz `tsc` "Cannot find name 'LayoutProps'" ilə sınır.
      # `next typegen` tam `build`-dən yüngüldür, yalnız tipləri yaradır.
      - run: npx next typegen
      - run: npx tsc --noEmit

  lint:
    name: eslint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm install
      - run: npx eslint
