# HANDOFF (73): "sıfır test" probleminin ən ucuz hissəsini bağlayır — 27 selftest halı
# (`scripts/eval.py --selftest`), 18/30/15 TS selftest halı (`web/lib/**/*.selftest.mts`)
# artıq var, sadəcə heç nə onları avtomatik işlətmirdi. Üç iş, paralel, hər push/PR-da.
#
# Qəsdən BURADA YOXDUR: TS selftest-lərin (`answer`/`math-format`/`step-check`) özləri —
# HANDOFF (73) yalnız `--selftest`/`tsc`/`eslint` istədi. `npx tsx **/*.selftest.mts` əlavə
# etmək asan növbəti addımdır, bu ADR-in/tapşırığın əhatəsində deyil.

name: CI

on:
  push:
  pull_request:

jobs:
  eval-selftest:
    name: eval.py --selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/eval.py --selftest

  typecheck:
    name: tsc --noEmit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  lint:
    name: eslint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx eslint
